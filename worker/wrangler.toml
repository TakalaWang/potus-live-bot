# Secrets (set via `pnpm exec wrangler secret put <NAME>`):
#   YOUTUBE_API_KEY      - Google Cloud API key with YouTube Data API v3 enabled
#   DISCORD_BOT_TOKEN    - bot token, used for REST fan-out to subscribed channels
#   DISCORD_PUBLIC_KEY   - Discord application public key (interactions signature check)
#   SUBSCRIPTIONS_SECRET - shared secret for GET /subscriptions (same value in GitHub secrets)
#   GITHUB_TOKEN         - fine-grained PAT, this repo only, Contents: read & write
name = "potus-live-worker"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[triggers]
crons = ["* * * * *"]

[vars]
# @WhiteHouse channel id
CHANNEL_ID = "UCYxRlFDqcWM4y7FfpiAN3KQ"
GITHUB_REPO = "TakalaWang/potus-live-bot"

[[kv_namespaces]]
binding = "STATE"
# create with: pnpm exec wrangler kv namespace create STATE
id = "PASTE_KV_NAMESPACE_ID_HERE"
