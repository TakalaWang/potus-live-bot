name: Run stream report
description: Download VOD audio and run the transcription/analysis pipeline
inputs:
  video_id:
    description: YouTube video id of the ended stream
    required: true
  title:
    description: Stream title
    required: true
  discord_bot_token:
    required: true
  worker_url:
    description: Cloudflare Worker base URL (subscription registry)
    required: true
  subscriptions_secret:
    required: true
  gemini_api_key:
    required: true
runs:
  using: composite
  steps:
    # client_payload is attacker-settable if the dispatch PAT ever leaks — validate before use
    - name: Validate video id
      shell: bash
      env:
        VIDEO_ID: ${{ inputs.video_id }}
      run: |
        if ! [[ "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{6,20}$ ]]; then
          echo "invalid video_id: $VIDEO_ID" >&2
          exit 1
        fi

    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    # pip install (not the standalone binary) so the PO token plugin loads;
    # bgutil provider raises the odds against YouTube bot-checks on datacenter IPs
    - name: Install ffmpeg, yt-dlp + PO token provider, deno
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg
        python3 -m pip install --quiet -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
        curl -fsSL https://deno.land/install.sh | sh
        echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
        docker run -d --name bgutil-pot -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider

    - name: Build
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        pnpm download-model
        pnpm build

    - name: Download VOD audio
      shell: bash
      env:
        VIDEO_ID: ${{ inputs.video_id }}
      run: |
        URL="https://www.youtube.com/watch?v=${VIDEO_ID}"
        yt-dlp -f "bestaudio/worst[acodec!=none]" --retries 5 -o audio.m4a "$URL" ||
          yt-dlp -f "bestaudio/worst[acodec!=none]" --retries 5 -o audio.m4a \
            --extractor-args "youtube:player_client=tv,web_safari" "$URL"

    - name: Run pipeline and send report
      shell: bash
      env:
        DISCORD_BOT_TOKEN: ${{ inputs.discord_bot_token }}
        SUBSCRIPTIONS_URL: ${{ inputs.worker_url }}/subscriptions
        SUBSCRIPTIONS_SECRET: ${{ inputs.subscriptions_secret }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        VIDEO_ID: ${{ inputs.video_id }}
        STREAM_TITLE: ${{ inputs.title }}
      run: |
        node dist/index.js --replay ./audio.m4a \
          --title "$STREAM_TITLE" \
          --url "https://www.youtube.com/watch?v=${VIDEO_ID}"
