name: stream-report

on:
  repository_dispatch:
    types: [stream-ended]
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video id
        required: true
      title:
        description: Stream title
        required: false
        default: White House live stream

concurrency:
  group: report-${{ github.event.client_payload.video_id || inputs.video_id }}
  cancel-in-progress: false

env:
  VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}
  STREAM_TITLE: ${{ github.event.client_payload.title || inputs.title }}

jobs:
  attempt-1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-report
        with:
          video_id: ${{ env.VIDEO_ID }}
          title: ${{ env.STREAM_TITLE }}
          discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
          worker_url: ${{ secrets.WORKER_URL }}
          subscriptions_secret: ${{ secrets.SUBSCRIPTIONS_SECRET }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

  # each retry runs on a fresh runner, i.e. a different IP (YouTube bot-check lottery);
  # !cancelled() is required — without a status-check function GitHub implies success()
  # and the retry job would be skipped when the previous attempt failed
  attempt-2:
    needs: attempt-1
    if: ${{ !cancelled() && needs.attempt-1.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-report
        with:
          video_id: ${{ env.VIDEO_ID }}
          title: ${{ env.STREAM_TITLE }}
          discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
          worker_url: ${{ secrets.WORKER_URL }}
          subscriptions_secret: ${{ secrets.SUBSCRIPTIONS_SECRET }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

  attempt-3:
    needs: [attempt-1, attempt-2]
    if: ${{ !cancelled() && needs.attempt-2.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-report
        with:
          video_id: ${{ env.VIDEO_ID }}
          title: ${{ env.STREAM_TITLE }}
          discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
          worker_url: ${{ secrets.WORKER_URL }}
          subscriptions_secret: ${{ secrets.SUBSCRIPTIONS_SECRET }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

  notify-failure:
    needs: [attempt-1, attempt-2, attempt-3]
    if: ${{ !cancelled() && needs.attempt-3.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord about the failure
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret not set; skipping failure alert"
            exit 0
          fi
          curl -sf -X POST -H 'content-type: application/json' "$WEBHOOK_URL" -d @- <<EOF
          {"content": "⚠️ 報告產生失敗（3 次重試後）：https://www.youtube.com/watch?v=${VIDEO_ID}\n手動重跑：${RUN_URL}"}
          EOF
