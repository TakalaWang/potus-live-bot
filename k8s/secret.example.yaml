# Template: fill in real values and save as secret.yaml (never commit real secrets)
# kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: potus-live-bot-secrets
  namespace: potus-live-bot
type: Opaque
stringData:
  DISCORD_BOT_TOKEN: "your-discord-bot-token"
  DISCORD_CHANNEL_ID: "your-channel-id"
  GEMINI_API_KEY: "your-gemini-api-key"
