apiVersion: apps/v1
kind: Deployment
metadata:
  name: potus-live-bot
  namespace: potus-live-bot
spec:
  replicas: 1 # must stay 1: multiple instances would duplicate notifications and transcription
  strategy:
    type: Recreate # avoid old and new pods pulling the stream simultaneously
  selector:
    matchLabels:
      app: potus-live-bot
  template:
    metadata:
      labels:
        app: potus-live-bot
    spec:
      terminationGracePeriodSeconds: 300 # allow ASR queue to drain on SIGTERM
      containers:
        - name: bot
          image: potus-live-bot:latest # replace with your registry
          envFrom:
            - secretRef:
                name: potus-live-bot-secrets
          env:
            - name: DATA_DIR
              value: /data
            - name: YOUTUBE_CHANNEL_URL
              value: https://www.youtube.com/@WhiteHouse/live
            - name: POLL_INTERVAL_SEC
              value: "60"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: potus-live-bot-data
